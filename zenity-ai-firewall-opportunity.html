<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenity — AI Firewall Opportunity</title>
<style>
:root{--bg:#090817;--surface:#15132A;--s2:#1D1A38;--violet:#A77CFF;--aqua:#6CE5D4;
--warm:#FFB36B;--white:#F7F5FF;--dim:#9A94BF;--line:#2C2850}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--white);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:74px}
#bar{position:fixed;top:0;left:0;right:0;height:50px;background:rgba(9,8,23,.93);backdrop-filter:blur(12px);
border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;z-index:100}
.brand{font-weight:600;font-size:12.5px;letter-spacing:.02em}.brand span{color:var(--violet)}
.modes{display:flex;gap:4px;margin-left:auto}
button.m{background:transparent;border:1px solid var(--line);color:var(--dim);padding:6px 12px;
border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
button.m:hover{color:var(--white);border-color:var(--violet)}
button.m.on{background:var(--violet);color:#0B0918;border-color:var(--violet);font-weight:600}
.toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--aqua);cursor:pointer}

#stage{padding:72px 20px 16px;max-width:1140px;margin:0 auto}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:34px 42px;
margin-bottom:20px;position:relative;min-height:530px;display:flex;flex-direction:column}
.slide.hidden{display:none}
.snum{position:absolute;top:16px;right:20px;font-size:10.5px;color:var(--dim);letter-spacing:.14em;font-weight:600}
.kicker{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--aqua);font-weight:700;margin-bottom:12px}
h1{font-size:30px;line-height:1.24;font-weight:650;letter-spacing:-.016em;max-width:21ch;margin-bottom:7px}
h1 em{font-style:normal;color:var(--violet)}
h1 strong{font-weight:650;color:var(--warm)}
h1.big{font-size:46px;max-width:16ch;line-height:1.14}
.sub{color:var(--dim);font-size:13.5px;margin-bottom:22px;max-width:64ch;line-height:1.5}
.body{flex:1;display:flex;flex-direction:column;justify-content:center}

/* atoms */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.card{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:15px 17px}
.card h3{font-size:12.5px;font-weight:650;margin-bottom:7px}
.card p,.card li{font-size:12.5px;line-height:1.5;color:var(--dim)}
.card ul{padding-left:15px;margin-top:5px}.card li{margin-bottom:3px}
.card.v{border-color:rgba(167,124,255,.45)}.card.v h3{color:var(--violet)}
.card.a{border-color:rgba(108,229,212,.42)}.card.a h3{color:var(--aqua)}
.card.w{border-color:rgba(255,179,107,.42)}.card.w h3{color:var(--warm)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
font-weight:700;padding:0 9px 8px 0;border-bottom:1px solid var(--line)}
td{padding:9px 9px 9px 0;border-bottom:1px solid rgba(44,40,80,.5);vertical-align:top;line-height:1.4}
td.k{font-weight:600;color:var(--white)}tr:last-child td{border-bottom:none}
.mono{font-variant-numeric:tabular-nums}
.big{display:flex;gap:38px;margin:4px 0 18px;flex-wrap:wrap}
.big b{display:block;font-size:40px;font-weight:680;line-height:1;letter-spacing:-.02em}
.big span{font-size:10.5px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase;display:block;margin-top:6px}
.note{border-left:2px solid var(--violet);padding:2px 0 2px 13px;font-size:12.5px;line-height:1.5;color:var(--dim);margin-top:14px}
.note b{color:var(--white);font-weight:600}
.todo{border:1px dashed rgba(255,179,107,.5);border-radius:10px;padding:18px 20px;background:rgba(255,179,107,.05)}
.todo h3{color:var(--warm);font-size:12.5px;margin-bottom:8px}
.todo li,.todo p{font-size:12.5px;color:var(--dim);line-height:1.55}
.todo ul{padding-left:16px;margin-top:6px}.todo li{margin-bottom:4px}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.04em}
.p-a{background:rgba(108,229,212,.16);color:var(--aqua)}
.p-v{background:rgba(167,124,255,.16);color:var(--violet)}
.p-w{background:rgba(255,179,107,.15);color:var(--warm)}
.p-d{background:rgba(154,148,191,.14);color:var(--dim)}
cite{font-style:normal;font-size:9.5px;color:var(--violet);cursor:pointer;vertical-align:super;
font-weight:700;padding:0 1px}
cite:hover{text-decoration:underline}
a.axl{color:var(--violet);font-size:11.5px;cursor:pointer;font-weight:600;white-space:nowrap}
a.axl:hover{text-decoration:underline}

/* capability grid */
.grid{width:100%;border-collapse:separate;border-spacing:5px;font-size:11.5px}
.grid th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
font-weight:700;padding:0 0 4px;border:none;text-align:center}
.grid th.rh{text-align:left;width:24%}
.grid td.rh{text-align:left;font-weight:600;color:var(--white);font-size:11.5px;
background:none;border:none;padding-right:8px;line-height:1.3}
.grid td{border-radius:7px;padding:9px 8px;text-align:center;line-height:1.3;
background:var(--s2);border:1px solid var(--line);color:var(--dim)}
.grid td.full{background:rgba(108,229,212,.17);border-color:var(--aqua);color:var(--aqua);font-weight:650}
.grid td.part{background:rgba(108,229,212,.05);border-color:rgba(108,229,212,.5);color:var(--aqua)}
.grid td.gap{background:rgba(255,179,107,.09);border:1px dashed var(--warm);color:var(--warm);font-weight:650}
.grid td.na{background:transparent;border-color:transparent;color:#5B567F}
.grid td.q{background:rgba(167,124,255,.09);border:1px dashed var(--violet);color:var(--violet)}
.gcol-hl{background:rgba(255,179,107,.07)}
.legend{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap;font-size:10.5px;color:var(--dim)}
.legend i{font-style:normal;display:inline-block;width:11px;height:11px;border-radius:3px;
margin-right:5px;vertical-align:-1px}

/* lean decision-story visuals */
.fork{display:grid;grid-template-columns:1fr 34px 1fr;align-items:stretch;gap:14px}
.fork .route{border-top:2px solid var(--violet);padding-top:13px}
.fork .route b,.plane b,.comp b,.rail b,.signal b{display:block;font-size:13px;color:var(--white);margin-bottom:6px}
.fork .route span,.plane span,.comp span,.rail span,.signal span{display:block;font-size:12px;line-height:1.45;color:var(--dim)}
.fork .join{display:flex;align-items:center;justify-content:center;color:var(--violet);font-size:24px}
.decision-line{margin:18px auto 0;max-width:680px;text-align:center;border:1px solid rgba(108,229,212,.45);background:rgba(108,229,212,.07);border-radius:9px;padding:11px 16px;font-size:13px;color:var(--aqua);font-weight:650}
.planes{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.plane{padding:4px 0 0}.plane+.plane{border-left:1px solid var(--line);padding-left:26px}
.plane h3{font-size:19px;margin-bottom:5px}.plane.h h3{color:var(--warm)}.plane.a h3{color:var(--aqua)}
.uses{margin-top:14px;display:grid;gap:8px}.use{padding:9px 11px;border-left:2px solid var(--line);background:rgba(255,255,255,.018);font-size:12px;line-height:1.4;color:var(--dim)}
.plane.h .use{border-color:var(--warm)}.plane.a .use{border-color:var(--aqua)}
.coverage{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.coverage .lane{padding:16px 0;border-top:2px solid var(--line)}
.coverage .lane.h{border-color:var(--warm)}.coverage .lane.a{border-color:var(--aqua)}
.coverage h3{font-size:15px;margin-bottom:12px}.coverage .meter{height:8px;background:#252143;border-radius:8px;overflow:hidden;margin-bottom:9px}
.coverage .fill{height:100%;background:var(--aqua)}.coverage .fill.partial{width:28%;background:var(--warm)}.coverage .fill.strong{width:88%}
.coverage p{font-size:12px;line-height:1.5;color:var(--dim)}
.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.number{padding:24px 22px}.number+.number{border-left:1px solid var(--line)}
.number strong{display:block;font-size:36px;line-height:1;color:var(--aqua);margin-bottom:9px}.number:last-child strong{color:var(--warm)}
.number b{font-size:12px;display:block;margin-bottom:5px}.number span{font-size:11.5px;line-height:1.45;color:var(--dim)}
.competitors{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.comp{padding:18px 20px}.comp+.comp{border-left:1px solid var(--line)}.comp .tag{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--violet);margin-bottom:9px}
.comp h3{font-size:17px;margin-bottom:7px}.comp ul{list-style:none;margin-top:11px}.comp li{font-size:11.5px;color:var(--dim);line-height:1.4;margin-bottom:6px}
.options{display:grid;grid-template-columns:.85fr 1.25fr .9fr;align-items:stretch;gap:12px}
.option{border-top:2px solid var(--line);padding:15px 12px 0}.option.pick{border-color:var(--violet);background:rgba(167,124,255,.06);padding:15px 16px;border-radius:0 0 9px 9px}
.option h3{font-size:15px;margin-bottom:8px}.option.pick h3{color:var(--violet)}.option p{font-size:11.5px;line-height:1.45;color:var(--dim)}
.rails{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rail{padding:18px 17px}.rail+.rail{border-left:1px solid var(--line)}.rail:nth-child(1) b{color:var(--aqua)}.rail:nth-child(2) b{color:var(--violet)}.rail:nth-child(3) b{color:var(--warm)}
.integration{display:grid;grid-template-columns:1fr 34px 1.25fr 34px 1fr;align-items:center;gap:8px}
.inode{min-height:148px;border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--s2)}
.inode h3{font-size:14px;margin-bottom:8px}.inode b{display:block;font-size:11px;color:var(--aqua);margin-top:10px}.inode p,.inode li{font-size:11.5px;color:var(--dim);line-height:1.45}.inode ul{padding-left:15px}.inode.partner{border-color:var(--warm)}.inode.zenity{border-color:var(--violet)}
.flow{text-align:center;color:var(--violet);font-size:20px}.flow span{display:block;font-size:9px;line-height:1.2;color:var(--dim);margin-top:4px}
.journey{display:grid;grid-template-columns:1fr 42px 1fr 42px 1fr;align-items:center;gap:8px}
.step{min-height:142px;border-top:2px solid var(--line);padding:15px 13px}.step.current{border-color:var(--aqua)}.step.wedge{border-color:var(--violet);background:rgba(167,124,255,.06)}.step.no{border-color:var(--warm)}
.step h3{font-size:14px;margin-bottom:8px}.step p,.step li{font-size:11.5px;color:var(--dim);line-height:1.45}.step ul{padding-left:14px}.arrow{text-align:center;color:var(--violet);font-size:22px}
.loop{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.signal{padding:18px 17px;position:relative}.signal+.signal{border-left:1px solid var(--line)}.signal:not(:last-child):after{content:'→';position:absolute;right:-8px;top:44%;color:var(--violet);z-index:2;background:var(--surface);padding:2px}
.questions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.q{border-top:2px solid var(--violet);padding:13px 5px 0;display:grid;grid-template-columns:28px 1fr;gap:9px}.q i{font-style:normal;color:var(--violet);font-weight:700}.q b{font-size:12.5px}.q span{display:block;font-size:11.5px;color:var(--dim);line-height:1.4;margin-top:4px}

/* method / chain of thought */
.method{display:grid;grid-template-columns:repeat(3,1fr);min-height:250px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.phase{padding:22px 22px;position:relative}
.phase+.phase{border-left:1px solid var(--line)}
.phase:not(:last-child):after{content:'→';position:absolute;right:-10px;top:47%;font-size:19px;color:var(--violet);background:var(--surface);padding:2px;z-index:2}
.phase>b{display:block;font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:700}
.phase>em{font-style:normal;display:block;font-size:12px;color:var(--dim);margin:4px 0 15px}
.phase:nth-child(1)>b{color:var(--aqua)}.phase:nth-child(2)>b{color:var(--violet)}.phase:nth-child(3)>b{color:var(--warm)}
.mstep{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:10px 0;border-top:1px solid rgba(44,40,80,.75)}
.mstep i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--dim);padding-top:2px;font-variant-numeric:tabular-nums}
.mstep b{display:block;font-size:12.5px;font-weight:600;line-height:1.3}
.mstep span{display:block;font-size:11px;color:var(--dim);line-height:1.35;margin-top:3px}

/* full-canvas editorial visuals */
.hero-rule{height:8px;width:78%;margin-top:auto;background:linear-gradient(90deg,var(--violet),var(--aqua),transparent);border-radius:8px}
.category-map{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:stretch}
.cat-plane{position:relative;padding:8px 0 0}.cat-plane+.cat-plane{border-left:1px solid var(--line);padding-left:36px}
.cat-plane h3{font-size:22px;margin-bottom:4px}.cat-plane.h h3{color:var(--warm)}.cat-plane.a h3{color:var(--aqua)}
.placement{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:18px}
.cap-row{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:9px 0;border-top:1px solid rgba(44,40,80,.7)}
.cap-row b{font-size:10px;letter-spacing:.1em;color:var(--dim)}.cap-row span{font-size:13px;line-height:1.35;color:var(--white)}
.case-row{margin-top:15px;padding-top:12px;border-top:2px solid currentColor}.cat-plane.h .case-row{color:var(--warm)}.cat-plane.a .case-row{color:var(--aqua)}
.case-row b{font-size:10px;letter-spacing:.12em;text-transform:uppercase}.case-row p{font-size:12px;line-height:1.45;color:var(--dim);margin-top:5px}
.coverage-hit{display:grid;grid-template-columns:42% 58%;min-height:230px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.coverage-hit>div{padding:28px 26px}.coverage-hit>div+div{border-left:1px solid var(--line)}
.coverage-hit .eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.coverage-hit strong{display:block;font-size:38px;line-height:1;margin:18px 0 15px}.coverage-hit .human strong{color:var(--warm)}.coverage-hit .agent strong{color:var(--aqua)}
.coverage-hit p{font-size:13px;line-height:1.5;color:var(--dim);max-width:34ch}.coverage-hit ul{list-style:none;margin-top:14px}.coverage-hit li{font-size:12px;color:var(--dim);margin:6px 0}.coverage-hit li:before{content:'→';color:var(--violet);margin-right:8px}
.demand-proof{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.proof{padding:24px 22px}.proof+.proof{border-left:1px solid var(--line)}.proof strong{font-size:36px;line-height:1;color:var(--aqua)}.proof:nth-child(2) strong{color:var(--violet)}.proof:nth-child(3) strong{color:var(--warm)}
.proof b{display:block;font-size:13px;margin:10px 0 6px}.proof span{font-size:11.5px;line-height:1.45;color:var(--dim)}
.market-read{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.market-read div{font-size:15px;line-height:1.35;padding-left:14px;border-left:3px solid var(--line)}.market-read .human{border-color:var(--warm)}.market-read .agent{border-color:var(--aqua)}.market-read small{display:block;font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.market-map{position:relative;height:255px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);margin:2px 34px 0 64px;background:linear-gradient(90deg,rgba(255,179,107,.035),rgba(108,229,212,.035))}
.axis-x,.axis-y{position:absolute;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}.axis-x{right:0;bottom:-22px}.axis-y{left:-53px;top:0;writing-mode:vertical-rl;transform:rotate(180deg)}
.player{position:absolute;transform:translate(-50%,-50%);padding:7px 11px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:11px;font-weight:650;white-space:nowrap}.player small{font-size:8px;color:var(--dim);margin-left:4px}.player.z{border-color:var(--aqua);color:var(--aqua);box-shadow:0 0 0 4px rgba(108,229,212,.07)}.player.c{border-color:var(--warm)}.player.p{border-color:var(--violet)}
.choice-stage{display:grid;grid-template-columns:.9fr 1.25fr .95fr;gap:18px;align-items:end;min-height:250px}
.choice{border-top:3px solid var(--line);padding:18px 14px;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}.choice:nth-child(1){min-height:178px}.choice:nth-child(2){min-height:238px;border-color:var(--violet);background:rgba(167,124,255,.08)}.choice:nth-child(3){min-height:210px}
.choice h3{font-size:17px;margin-bottom:12px}.choice:nth-child(2) h3{color:var(--violet)}.choice b{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin:11px 0 4px}.choice p{font-size:12px;line-height:1.45;color:var(--dim)}
.heatmap{display:grid;grid-template-columns:44px 1fr;grid-template-rows:1fr 28px;height:275px;margin-top:2px}.hm-y{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:center}.hm-x{grid-column:2;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:center;padding-top:9px}
.hm-field{position:relative;border-left:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(135deg,rgba(255,179,107,.04),transparent 45%,rgba(108,229,212,.07))}
.hm-field:before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed rgba(154,148,191,.22)}.hm-field:after{content:'';position:absolute;top:50%;left:0;right:0;border-top:1px dashed rgba(154,148,191,.22)}
.bubble{position:absolute;transform:translate(-50%,-50%);width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;padding:9px;border:1px solid var(--line);background:rgba(21,19,42,.94);font-size:10.5px;line-height:1.2;font-weight:650;z-index:2}.bubble i{display:block;font-style:normal;font-size:14px;color:var(--aqua);margin-top:3px}.bubble.core{border:2px solid var(--aqua);box-shadow:0 0 0 5px rgba(108,229,212,.05)}.bubble.conditional{width:74px;height:74px;border-style:dashed;color:var(--dim);font-size:9.5px}
.hm-wedge{position:absolute;left:35%;bottom:9px;width:28%;border-top:2px solid var(--violet);padding-top:6px;color:var(--violet);font-size:9.5px;line-height:1.25;font-weight:700;text-align:center;z-index:3;background:linear-gradient(90deg,transparent,var(--surface) 12%,var(--surface) 88%,transparent)}
.risk-bridge{display:grid;grid-template-columns:1fr 46px 1.15fr 46px 1.1fr;align-items:center;gap:8px}.rb-node{min-height:166px;border-top:3px solid var(--line);padding:17px 12px;background:rgba(255,255,255,.018)}.rb-node.zs{border-color:var(--warm)}.rb-node.zen{border-color:var(--violet)}.rb-node h3{font-size:16px;margin-bottom:10px}.rb-node p,.rb-node li{font-size:11.5px;line-height:1.45;color:var(--dim)}.rb-node ul{padding-left:15px}.rb-arrow{text-align:center;color:var(--violet);font-size:22px}.rb-arrow small{display:block;font-size:8.5px;line-height:1.25;color:var(--dim);margin-top:5px}
.validation-band{display:grid;grid-template-columns:repeat(4,1fr);min-height:245px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.vstep{padding:26px 20px;position:relative}.vstep+.vstep{border-left:1px solid var(--line)}.vstep:not(:last-child):after{content:'→';position:absolute;right:-10px;top:46%;font-size:20px;color:var(--violet);background:var(--surface);padding:2px}.vstep i{font-style:normal;font-size:34px;color:var(--violet);opacity:.55}.vstep b{display:block;font-size:17px;margin:14px 0 10px}.vstep span{font-size:12px;line-height:1.55;color:var(--dim)}

/* ============ CAPABILITY GRID ============ */
const ROWS=["Inspect what goes in","Filter what comes out","Authorize the action",
            "Trace the whole session","Discover unsanctioned use","Prove it to an auditor"];
const COLS=["Human → AI tool","Agent → Tool / API","Agent → Agent"];

function grid(cells,hl){
  let h=`<table class="grid"><tr><th class="rh"></th>`;
  COLS.forEach((c,i)=>h+=`<th class="${hl===i?'gcol-hl':''}">${c}</th>`);
  h+=`</tr>`;
  ROWS.forEach((r,ri)=>{
    h+=`<tr><td class="rh">${r}</td>`;
    cells[ri].forEach((c,ci)=>{
      h+=`<td class="${c[0]} ${hl===ci?'gcol-hl':''}">${c[1]}</td>`;});
    h+=`</tr>`;});
  return h+`</table>`;
}

  <div class="q"><i>01</i><div><b>What is the company endgame?</b><span>Independent AI-security platform—or the indispensable agent-control layer?</span></div></div>
  <div class="q"><i>02</i><div><b>Where is revenue actually lost?</b><span>Human coverage, action depth, price or incumbent distribution?</span></div></div>
  <div class="q"><i>03</i><div><b>What valuable usage bypasses Zenity?</b><span>The traffic denominator decides whether partner reach is enough.</span></div></div>
  <div class="q"><i>04</i><div><b>What is already enforced A2A?</b><span>Visibility, policy evaluation—or pre-execution authorization?</span></div></div>
 </div>
 <div class="decision-line">Until those facts change the answer: selective expansion · partner-led human reach · no universal proxy</div>`,
 mp:"Convert unknowns into a productive leadership discussion.",risk:"Keep the close on decision-changing facts, not a generic ask.",st:"ready",min:4}
];

/* ============ APPENDIX SLIDES ============ */
const AX=[
{id:"A1",kicker:"Appendix A1 · Architecture",
 h:"Six enforcement points. Zenity occupies four.",
 sub:"Where a control physically sits determines what it can ever know. Referenced from slide 4.",
 body:ARCH+`<div class="cols" style="margin-top:8px">
  <div class="card a"><h3>What the gateway proves</h3><p>MCP Security: <i>"publish a server, register one gateway URL, and agents keep working unchanged"</i> — inline allow / modify / block on live context. The proxy pattern and the operational muscle already exist.${C("S4")}</p></div>
  <div class="card w"><h3>What point 1 costs</h3><p>Without a human-channel control, usage touching no integrated platform and no registered MCP server is not publicly evidenced. That is the personal-account developer case on slides 3 and 9.</p></div>
 </div>
 <div class="note"><b>The decision, precisely stated.</b> Not "should Zenity build a gateway" — it built one, and placed it deliberately. The question is whether that placement extends to point 1, or whether point 1 is deliberately ceded.</div>`},

{id:"A2",kicker:"Appendix A2 · Postures",
 h:"Three strategic postures. Partnering is a sourcing choice.",
 sub:"Scored on six criteria fixed before scoring. Full weights and sensitivity in the data model.",
 body:`<table>
  <tr><th style="width:26%">Posture</th><th style="width:11%">Score</th><th>Why it ranks there</th></tr>
  <tr><td class="k">Agentic AI Firewall<br><span style="color:var(--aqua);font-weight:400;font-size:11px">selective — recommended</span></td><td class="mono k">87.0</td><td>Captures the buyer outcome without moving Zenity's centre of gravity into incumbent territory</td></tr>
  <tr><td class="k">Agent Security Specialist<br><span style="color:var(--dim);font-weight:400;font-size:11px">stay focused</span></td><td class="mono">77.0</td><td>Wins if capacity is fully committed and content gaps never appear in losses</td></tr>
  <tr><td class="k">Enterprise AI Firewall Platform<br><span style="color:var(--dim);font-weight:400;font-size:11px">build broadly</span></td><td class="mono">65.0</td><td>Strongest completeness, weakest focus. Hardest to reverse once traffic routes through us</td></tr>
 </table>
 <div class="note" style="border-color:var(--violet)"><b>Why partner remains inside selective expansion.</b> Partner for human-channel placement while Zenity retains the policy, action-control and customer-value layer. Do not outsource the differentiated core.</div>
 <div class="note" style="border-color:var(--warm)"><b>Model honesty.</b> The gap between ranks 1 and 2 is 10 points; between the top three opportunity bundles it is under 4. We trust the posture ordering more than the opportunity ordering, and say so.</div>`}
];

/* ============ RENDER ============ */
const stage=document.getElementById('stage'),hlW=document.getElementById('hl'),apxW=document.getElementById('apx');
const stM={ready:['ready','Ready'],partial:['partial','Partial'],none:['none','Not started']};
const words=h=>{const d=document.createElement('div');d.innerHTML=h;
  d.querySelectorAll('table.grid,svg,cite').forEach(e=>e.remove());
  return (d.textContent||'').trim().split(/\s+/).filter(Boolean).length;};

stage.innerHTML=S.map(s=>{const w=words(s.body);return `
<section class="slide" data-n="${s.n}">
 <div class="snum">${String(s.n).padStart(2,'0')} / ${S.length}</div>
 <div class="kicker">${s.kicker}</div>
 <h1 class="${s.big?'big':''}">${s.h}</h1>
 ${s.sub?`<p class="sub">${s.sub}</p>`:''}
 <div class="body">${s.body}</div>
 <div class="review">
  <div><h4>Must prove</h4>${s.mp}</div>
  <div><h4>Risk</h4>${s.risk}</div>
  <div><h4>Status</h4><span class="st ${stM[s.st][0]}">${stM[s.st][1]}</span></div>
  <div><h4>Body words · ${s.min} min</h4><span class="wc ${w<=70?'ok':'over'}">${w} / 70</span></div>
 </div></section>`}).join('');

hlW.innerHTML=`<div class="intro"><b style="color:var(--white)">The headline test.</b> Read these sixteen lines in order. If a director can restate the recommendation and its logic, the deck works. If not, the problem is the argument — not the design.</div>`
+S.map(s=>`<div class="r"><div class="n">${String(s.n).padStart(2,'0')}</div><div class="t">${s.h.replace(/<\/?em>/g,'')}</div></div>`).join('');

apxW.innerHTML=AX.map(a=>`
 <section class="slide" id="ax-${a.id}" style="margin-bottom:20px">
  <div class="snum">${a.id}</div>
  <div class="kicker">${a.kicker}</div>
  <h1>${a.h}</h1>
  <p class="sub">${a.sub}</p>
  <div class="body">${a.body}</div>
 </section>`).join('')
+`<h2 style="margin-top:32px">Appendix — sources</h2>
<p class="lead">Every citation marker in the deck links here. Every entry links to its source. Evidence level and known limitations are stated per source.</p>`
+SRC.map(s=>`<div class="src" id="src-${s.id}">
 <div class="id">${s.id}<span class="lvl ${s.l}">${s.l}</span></div>
 <div class="ti">${s.t}</div>
 <div class="mt">${s.p}<br>${s.n}</div>
 <a href="${s.u}" target="_blank" rel="noopener">${s.u}</a></div>`).join('');

/* modes */
let mode='present',cur=0;
const slides=[...document.querySelectorAll('.slide')],dots=document.getElementById('dots');
dots.innerHTML=S.map((_,i)=>`<button class="dot${i?'':' on'}" data-i="${i}"></button>`).join('');
const dotEls=[...document.querySelectorAll('.dot')];
function show(i){cur=Math.max(0,Math.min(S.length-1,i));
 if(mode==='present')slides.forEach((s,j)=>s.classList.toggle('hidden',j!==cur));
 dotEls.forEach((d,j)=>d.classList.toggle('on',j===cur));
 document.getElementById('pos').textContent=`${cur+1} / ${S.length}`;
 if(mode==='present')window.scrollTo(0,0);}
function setMode(m){mode=m;
 document.querySelectorAll('button.m').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
 hlW.classList.toggle('hidden',m!=='headlines');
 apxW.classList.toggle('hidden',m!=='appendix');
 stage.style.display=(m==='headlines'||m==='appendix')?'none':'block';
 document.getElementById('nav').classList.toggle('hidden',m!=='present');
 if(m==='skim'){slides.forEach(s=>s.classList.remove('hidden'));window.scrollTo(0,0);}
 if(m==='present')show(cur);}
document.querySelectorAll('button.m').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
dotEls.forEach(d=>d.onclick=()=>show(+d.dataset.i));
document.getElementById('rev').onchange=e=>document.body.classList.toggle('clean',!e.target.checked);
document.addEventListener('click',e=>{
 const c=e.target.closest('cite');
 if(c){setMode('appendix');setTimeout(()=>{const t=document.getElementById('src-'+c.dataset.s);
  if(t){t.scrollIntoView({behavior:'smooth',block:'center'});location.hash='src-'+c.dataset.s;}},60);return;}
 const a=e.target.closest('.axl');
 if(a){setMode('appendix');setTimeout(()=>{const t=document.getElementById('ax-'+a.dataset.ax);
  if(t)t.scrollIntoView({behavior:'smooth',block:'start'});},60);}});
document.addEventListener('keydown',e=>{if(mode!=='present')return;
 if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();show(cur+1)}
 if(e.key==='ArrowLeft'){e.preventDefault();show(cur-1)}});
show(0);
</script>
</body>
</html>
